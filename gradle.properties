# Build tuning. Values below were originally measured on a 16-thread / 32 GB box, 2026-08-05, on
# the Fabric/Loom branch this was ported from -- carried over as-is onto ModDevGradle at the
# NeoForge port and NOT re-benchmarked for it (whole-branch review, 2026-08-27). The per-line
# reasoning that cited Loom specifically has been reworded below to not claim evidence that no
# longer applies; the numeric values themselves may still be reasonable (ModDevGradle also holds a
# resolved Minecraft/NeoForge dependency graph and forked test JVMs in memory, the same rough shape
# of workload Loom had), but that is an inference, not a re-measurement. Re-verify if a build
# becomes memory- or time-constrained on this branch.
# Daemon heap: 2G was the pre-port value. The build toolchain (Loom, and now ModDevGradle) holds
# a resolved Minecraft dependency graph in memory; 4G removes GC pressure without starving the
# forked test JVMs (test { maxHeapSize } is configured separately, in build.gradle).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
# Single-module project, so this does nothing on its own today, but it is free and correct.
org.gradle.parallel=true
# Reuse task outputs across `clean` and branch switches, not just up-to-date checks.
org.gradle.caching=true
# Skips a fixed startup+configuration cost on every subsequent build (~5.8s, measured against
# fabric-loom 1.17.13 on 2026-08-05 -- not re-measured against ModDevGradle 2.0.91 on this branch).
# If configuration-cache support ever breaks under a future ModDevGradle bump, the build fails
# loudly with a configuration-cache report rather than silently misbehaving.
org.gradle.configuration-cache=true

# NeoForge toolchain — this branch targets exactly Minecraft 1.21.1.
# neo_version verified against maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml
# on 2026-08-26 (latest 21.1.x release at that time).
minecraft_version=1.21.1
neo_version=21.1.248
# Restored per line 49's own note below ("Only minecraft_version and supported_minecraft_versions
# above are per-band") -- carried over from the Fabric branches' convention but missing from this
# port until Task 8, when guards/BandDocsMatchRealityTest.java (kept in scope as a general
# per-branch doc-consistency check, not Fabric-band tooling -- see task-8-report.md) failed every
# assertion reading this property with "gradle.properties declares no supported_minecraft_versions".
# This port targets exactly one Minecraft version, so the value is the singleton set.
supported_minecraft_versions=1.21.1

# Config backend
snakeyaml_version=2.3

# Test toolchain
junit_version=5.11.4
# Mockito 5 mocks final classes out of the box (inline mock maker is the 5.x default), so the
# platform/ adapters (final wrappers over net.minecraft types) can be mocked in MC-free unit tests.
mockito_version=5.14.2

# Mod metadata
#
# THIS FORK'S OWN VERSION LINE. It restarted at 1.0.0 on 2026-08-18 (ruling R-s) and is unrelated to
# upstream mcMMO's Bukkit plugin, whose numbering this used to borrow (`2.2.050`). Nothing about the
# two release cadences is comparable, so sharing a number only invited the reader to compare them.
#
# Two properties of the FORM are load-bearing, not stylistic:
#   * Plain, UNPADDED semver. Fabric's parser normalises a padded patch -- `Version.parse("2.2.050")`
#     reports `2.2.50` -- so the jar filename said `2.2.050+mc...` while ModMenu said `2.2.50+mc...`.
#     `1.0.0` round-trips, and the two finally agree. Do not zero-pad a segment to make it sort.
#   * `-SNAPSHOT` on the branch; `release.yml` strips it and releases the bare version. That strip is
#     the ONLY permitted difference between this value and the one a release builds with, and
#     BandVersionLabelTest fails on any other.
#
# WARNING: BUMP THIS BEFORE A RELEASE. `release.yml` tags `mc<MCVER>-v<version>`, so shipping without
# a bump used to silently REPLACE that band's release and re-point a tag every clone had already
# fetched. Since ruling R-t that is a hard CI failure rather than a silent one -- the run refuses to
# publish a version that already shipped a different commit, and tells you to bump. TODO.md Phase 13.
#
# WARNING: this value is NOT per-band -- it back-ports like any other fix and is identical on every
# branch (R-p). Only `minecraft_version` and `supported_minecraft_versions` above are per-band. The
# bands are kept apart by the `mc<MCVER>-v` prefix on the TAG, not by this number.
mod_version=1.2.0-SNAPSHOT
maven_group=com.gmail.nossr50
archives_base_name=mcmmo
