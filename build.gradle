plugins {
    id 'net.neoforged.moddev' version '2.0.91'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral() // JUnit (and future plain-Java test/util deps)
}

// -----------------------------------------------------------------------------
// Incremental migration note.
//
// This branch (neoforge/1.21.1) is being ported package-by-package from the Fabric/Loom
// build on mc/1.21.1 per docs/superpowers/plans/2026-08-26-neoforge-port-phase1-plan.md.
// `com/gmail/nossr50/fabric/**` (including `fabric/commands/`) still references net.fabricmc
// APIs that are not on the classpath under ModDevGradle, so it remains EXCLUDED here pending
// its own deletion task (Task 8, once neoforge/ replaces it).
//
// Task 3 re-mapped `com/gmail/nossr50/platform/**` (and its `scheduler/`, `skills/`, `text/`
// subpackages) to NeoForge's official Minecraft mappings. `platform/` and the core-gameplay
// layer are mutually dependent -- platform/ files import core datatypes and the core layer
// imports platform/ interfaces -- so they cannot compile in isolation from each other. This
// include list therefore widens in the same step to cover every core-gameplay package platform/
// files transitively touch: skills/, datatypes/, util/, commands/ (fabric/commands/ is a
// separate path under fabric/, not under commands/, so excluding fabric/** already keeps it
// out), config/, runnables/, event/, database/, locale/. Only `com/gmail/nossr50/fabric/**`
// remains excluded now, pending its own deletion task.
// -----------------------------------------------------------------------------
sourceSets {
    main {
        java {
            include 'com/gmail/nossr50/neoforge/**'
            include 'com/gmail/nossr50/platform/**'
            include 'com/gmail/nossr50/skills/**'
            include 'com/gmail/nossr50/datatypes/**'
            include 'com/gmail/nossr50/util/**'
            include 'com/gmail/nossr50/commands/**'
            include 'com/gmail/nossr50/config/**'
            include 'com/gmail/nossr50/runnables/**'
            include 'com/gmail/nossr50/event/**'
            include 'com/gmail/nossr50/database/**'
            include 'com/gmail/nossr50/locale/**'
        }
    }
    // Task 8: src/test/java compiles against real Minecraft types (McTestRegistries and dozens of
    // unit tests mock/exercise net.minecraft.* classes directly, official-mapped). The NeoForge
    // ModDevGradle plugin wires the Minecraft/NeoForge dependency graph onto sourceSets.main's own
    // compileClasspath, not onto a configuration testCompileClasspath extends from -- confirmed by
    // `./gradlew dependencies --configuration testCompileClasspath` showing only JUnit/Mockito/
    // snakeyaml, versus `--configuration compileClasspath` showing the full Minecraft/NeoForge/
    // Netty/LWJGL graph. Without this, every net.minecraft.* import in src/test/java fails with
    // "package ... does not exist" regardless of whether it uses yarn or official names.
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = project.neo_version

    // Task 9: `./gradlew tasks --all` showed no runServer/runClient tasks -- ModDevGradle only
    // generates run tasks for runs declared here, unlike Loom which ships a default runServer/
    // runClient out of the box. This block was never added on this branch (Tasks 1-8 only needed
    // compileJava/test, not a bootable dev server), so Task 9's own Step 3 (boot a dedicated
    // server) had no task to run. Declaring the mod's sourceSet under `mods {}` wires this jar's
    // classes/resources onto the run's classpath so NeoForge actually loads mcmmo, not just
    // vanilla + NeoForge.
    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
        }
        // The dev runs above load mcmmo's classes/resources straight from sourceSets.main
        // (unpacked), not from the packaged+JiJ jar -- so `jarJar` embedding (which only takes
        // effect once NeoForge scans an actual packaged mod jar for nested jars) does nothing
        // for these runs. snakeyaml is an `implementation` dependency, not a `jarJar`-only one,
        // but plain `implementation` deps are still not visible to the mod's isolated
        // classloader at dev-run time (confirmed: they're absent from
        // build/moddev/serverLegacyClasspath.txt) -- only what's declared here on
        // additionalRuntimeClasspathConfiguration is. Reusing the `jarJar` configuration as the
        // source keeps one list of "runtime libraries mcmmo needs beyond NeoForge itself" instead
        // of maintaining it twice.
        configureEach {
            additionalRuntimeClasspathConfiguration.extendsFrom(configurations.jarJar)
        }
    }

    mods {
        mcmmo {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // YAML config backend. mcMMO's configs are .yml (ported from Bukkit's YamlConfiguration);
    // snakeyaml replaces that engine.
    //
    // Task 9: runServer crashed at "mcMMO enabling for server session" with
    // NoClassDefFoundError: org/yaml/snakeyaml/Yaml. Root cause: NeoForge loads each mod in its
    // own isolated module-path classloader, and a plain Gradle `implementation` dependency is
    // NOT put on that classloader's view -- only the mod's own classes/resources and anything
    // explicitly Jar-in-Jar'd (the `jarJar` configuration) are. This is not a dev-run-only quirk;
    // a real installed jar would hit the exact same NoClassDefFoundError at runtime, so `jarJar`
    // (embedding snakeyaml inside the shipped mod jar) is the actual fix, not a test-harness
    // workaround.
    implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"
    jarJar "org.yaml:snakeyaml:${project.snakeyaml_version}"

    // Unit tests for MC-free code (the platform/ + event/ + skill-manager + config layers).
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito for MC-free unit tests that need to stand in for the platform/ adapters.
    testImplementation "org.mockito:mockito-core:${project.mockito_version}"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
    it.options.compilerArgs << '-Xlint:deprecation'
}

test {
    useJUnitPlatform()
    maxParallelForks = 4
    maxHeapSize = '1g'
}

jar {
    // Same configuration-cache-friendly pattern the Fabric build used: resolve the name up
    // front, not inside the rename closure, which runs at execution time.
    def archiveName = project.base.archivesName.get()
    from('LICENSE') {
        rename { "${it}_${archiveName}" }
    }
}
