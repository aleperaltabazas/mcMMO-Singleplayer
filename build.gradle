plugins {
    id 'net.neoforged.moddev' version '2.0.91'
    id 'java'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral() // JUnit (and future plain-Java test/util deps)
}

// -----------------------------------------------------------------------------
// Incremental migration note.
//
// This branch (neoforge/1.21.1) is being ported package-by-package from the Fabric/Loom
// build on mc/1.21.1 per docs/superpowers/plans/2026-08-26-neoforge-port-phase1-plan.md.
// `com/gmail/nossr50/fabric/**` still references net.fabricmc APIs (no longer on the
// classpath under ModDevGradle) and `com/gmail/nossr50/platform/**` (plus everything under
// skills/, datatypes/, util/, config/, runnables/, commands/, database/, locale/ that
// transitively imports platform/) still references yarn-mapped `net.minecraft.*` names,
// which NeoForge's official-mappings classpath does not have. Both are ported by later tasks
// in that plan (Task 3 re-maps platform/, Task 8 deletes fabric/ once neoforge/ replaces it).
// Until then, only the new `com.gmail.nossr50.neoforge` package is compiled, so this task's
// walking-skeleton build is green without editing any of that legacy code. Widen (or remove)
// this include filter as each later task finishes porting its package.
// -----------------------------------------------------------------------------
sourceSets {
    main {
        java {
            include 'com/gmail/nossr50/neoforge/**'
        }
    }
}

neoForge {
    version = project.neo_version
}

dependencies {
    // YAML config backend. mcMMO's configs are .yml (ported from Bukkit's YamlConfiguration);
    // snakeyaml replaces that engine.
    implementation "org.yaml:snakeyaml:${project.snakeyaml_version}"

    // Unit tests for MC-free code (the platform/ + event/ + skill-manager + config layers).
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Mockito for MC-free unit tests that need to stand in for the platform/ adapters.
    testImplementation "org.mockito:mockito-core:${project.mockito_version}"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
    it.options.compilerArgs << '-Xlint:deprecation'
}

test {
    useJUnitPlatform()
    maxParallelForks = 4
    maxHeapSize = '1g'
}

jar {
    // Same configuration-cache-friendly pattern the Fabric build used: resolve the name up
    // front, not inside the rename closure, which runs at execution time.
    def archiveName = project.base.archivesName.get()
    from('LICENSE') {
        rename { "${it}_${archiveName}" }
    }
}
